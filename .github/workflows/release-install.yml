name: Published module installation

on:
  workflow_dispatch:
    inputs:
      core_version:
        description: Published core v0.MINOR.PATCH[-rc.N]
        type: string
        required: true
      adapter_version:
        description: Published adapter v0.MINOR.PATCH[-rc.N]
        type: string
        required: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Verify independent cold consumers
        env:
          CORE_VERSION: ${{ inputs.core_version }}
          ADAPTER_VERSION: ${{ inputs.adapter_version }}
        run: >-
          python3 spec/tools/release_install.py
          --core-version "$CORE_VERSION"
          --adapter-version "$ADAPTER_VERSION"
          --output .cache/published-install
      - name: Retain success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-install-${{ github.run_attempt }}
          path: .cache/published-install/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
